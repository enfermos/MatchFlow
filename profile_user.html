<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchFlow - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="d-flex">
        <div class="sidebar bg-white shadow-sm">
            <div class="sidebar-header p-3">
                <div class="logo d-flex align-items-center">
                    <span class="logo-text fw-bold">MatchFlow</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
                <a href="profile_user.html" class="nav-item active">
                    <i class="bi bi-person"></i>
                    Mi Perfil
                </a>
            </nav>
        </div>

        <div class="main-content flex-grow-1">
            <header class="header bg-white shadow-sm p-3 sticky-top">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <a href="dashboard.html" class="text-decoration-none text-muted" aria-label="Inicio">
                            <i class="bi bi-house"></i>
                        </a>
                        <i class="bi bi-chevron-right text-muted chevron-small"></i>
                        <span class="text-dark">Mi Perfil</span>
                    </div>
                    
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-link text-muted p-2" aria-label="Notificaciones">
                            <i class="bi bi-bell fs-5"></i>
                        </button>
                        
                        <div class="dropdown">
                            <button class="btn dropdown-toggle user-profile-btn d-flex align-items-center gap-2 border-0 bg-transparent" type="button" data-bs-toggle="dropdown">
                                <div class="user-avatar-placeholder">
                                    <i class="bi bi-person-fill"></i>
                                </div>
                                <div class="text-start">
                                    <div class="user-name" id="headerUserName">Usuario</div>
                                    <small class="user-role" id="headerUserRole">Profesión</small>
                                </div>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow">
                                <li>
                                    <a class="dropdown-item d-flex align-items-center gap-2" href="profile_user.html">
                                        <i class="bi bi-person"></i>
                                        Mi Perfil
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item d-flex align-items-center gap-2" href="dashboard.html">
                                        <i class="bi bi-speedometer2"></i>
                                        Dashboard
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="#" onclick="logout()">
                                        <i class="bi bi-box-arrow-right"></i>
                                        Cerrar Sesión
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content p-4">
                <h1 class="h3 mb-4">Mi Perfil</h1>

                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center p-4">
                                <div class="mb-4 position-relative d-inline-block">
                                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" 
                                         style="width: 100px; height: 100px; font-size: 48px; overflow: hidden;"
                                         id="profileAvatar">
                                        <i class="bi bi-person-fill"></i>
                                    </div>
                                    <button class="btn btn-sm btn-primary rounded-circle position-absolute" 
                                            style="bottom: 0; right: -5px; width: 32px; height: 32px; padding: 0;"
                                            id="changeAvatarBtn" 
                                            type="button"
                                            title="Cambiar foto">
                                        <i class="bi bi-camera-fill"></i>
                                    </button>
                                    <input type="file" id="avatarInput" accept="image/*" class="d-none">
                                </div>
                                
                                <h5 class="mb-1" id="profileName">Usuario</h5>
                                <p class="text-muted mb-2" id="profileUsername">@username</p>
                                
                                <span class="badge bg-success mb-3" id="profileDisponibilidad">DISPONIBLE</span>
                                
                                <div class="d-flex align-items-center justify-content-center gap-2 text-muted mb-2">
                                    <i class="bi bi-envelope"></i>
                                    <small id="profileEmail">correo@ejemplo.com</small>
                                </div>
                                
                                <div class="d-flex align-items-center justify-content-center gap-2 text-muted">
                                    <i class="bi bi-briefcase"></i>
                                    <small id="profileProfesion">Profesión</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                                <h6 class="mb-0">Información Personal</h6>
                                <button class="btn btn-sm btn-primary" id="editProfileBtn">
                                    <i class="bi bi-pencil"></i> Editar Perfil
                                </button>
                            </div>
                            <div class="card-body p-4">
                                <div id="errorMessage" class="alert alert-danger d-none"></div>
                                <div id="successMessage" class="alert alert-success d-none"></div>
                                
                                <form id="profileForm">
                                    <div class="row g-4">
                                        <div class="col-md-6">
                                            <label class="form-label">Nombre <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="infoNombre" required disabled>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Username <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="infoUsername" required disabled>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Correo <span class="text-danger">*</span></label>
                                            <input type="email" class="form-control" id="infoCorreo" required disabled>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Edad</label>
                                            <input type="number" class="form-control" id="infoEdad" min="0" disabled>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Experiencia (años)</label>
                                            <input type="text" class="form-control" id="infoExperiencia" disabled>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Profesión <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="infoProfesion" required disabled>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Disponibilidad</label>
                                            <select class="form-select" id="infoDisponibilidad" disabled>
                                                <option value="DISPONIBLE">DISPONIBLE</option>
                                                <option value="NO_DISPONIBLE">NO_DISPONIBLE</option>
                                                <option value="RESERVADO">RESERVADO</option>
                                            </select>
                                            <small class="text-muted">Si está RESERVADO, no podrás cambiarlo</small>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Estado de Proceso (solo lectura)</label>
                                            <input type="text" class="form-control" id="infoProceso" readonly disabled>
                                        </div>
                                    </div>
                                    
                                    <div id="saveButtonContainer" class="mt-4 d-none">
                                        <button type="submit" class="btn btn-primary me-2">
                                            <i class="bi bi-check-lg"></i> Guardar Cambios
                                        </button>
                                        <button type="button" class="btn btn-secondary" id="cancelBtn">
                                            <i class="bi bi-x-lg"></i> Cancelar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/profile_user.js"></script>
</body>
</html>
